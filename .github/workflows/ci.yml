name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Typecheck, tests, lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint

  mobile-browser:
    name: Mobile browser regressions (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LH_MOBILE_TEST_DIR: ${{ runner.temp }}/mobile-browser-artifacts
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - name: Install Puppeteer's supported Chrome
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { install, Browser } from '@puppeteer/browsers';
          import { PUPPETEER_REVISIONS } from 'puppeteer-core';
          const browser = await install({
            browser: Browser.CHROME,
            buildId: PUPPETEER_REVISIONS.chrome,
            cacheDir: `${process.env.RUNNER_TEMP}/mobile-chrome`,
          });
          console.log(`Chrome ${PUPPETEER_REVISIONS.chrome}: ${browser.executablePath}`);
          appendFileSync(process.env.GITHUB_ENV, `CHROMIUM_PATH=${browser.executablePath}\n`);
          NODE
      # These scripts are intentionally outside ESLint's scope.
      - name: Check browser harness syntax
        run: |
          node --check scripts/mobile-browser-runner.mjs
          node --check scripts/mobile-browser-result.mjs
          node --check scripts/run-mobile-checks.mjs
          node --check scripts/smoke-mobile-inputs.mjs
          node --check scripts/smoke-question-reveal.mjs
          node --check scripts/smoke-mobile-layout.mjs
      - run: npm run test:mobile
      - name: Retain browser run result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-browser-result-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mobile-browser-artifacts/**/result.json
          if-no-files-found: warn
          retention-days: 7
      - name: Retain browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: mobile-browser-failure-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/mobile-browser-artifacts/**/*.log
            ${{ runner.temp }}/mobile-browser-artifacts/**/failure.png
            ${{ runner.temp }}/mobile-browser-artifacts/**/failure.txt
          if-no-files-found: warn
          retention-days: 7

  standalone:
    name: Standalone (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Standard macos-15 runners are Apple Silicon (not macos-15-intel).
          - os: macos-15
            platform: mac-arm64
          - os: windows-2025
            platform: windows-x64
          - os: ubuntu-24.04
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - name: Native renderer tests on this OS
        run: npx electron --import tsx --test tests/pdf-native-render.test.ts tests/pdf-ops.test.ts tests/svg-native-render.test.ts tests/browser-service.test.ts
        env:
          NODE_ENV: test
          ELECTRON_RUN_AS_NODE: "1"
      - run: npm run build
      # Check the fresh trace before any static copying/curation.
      - run: node scripts/smoke-provider-runtime.mjs
      - run: node scripts/build-server.mjs
      - run: node scripts/smoke-server.mjs --electron
